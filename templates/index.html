<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexora AI — Intelligent Assistant</title>


    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(59,130,246,.18), transparent 38%),
                #080d18;
            color: #f8fafc;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 80%);
        }

        .container {
            width: 100%;
            max-width: 980px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            text-align: center;
            padding: 28px 20px 18px;
            border-bottom: 1px solid rgba(148,163,184,.14);
            backdrop-filter: blur(16px);
            background: rgba(8,13,24,.72);
            position: relative;
            z-index: 2;
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -1.2px;
            margin-bottom: 6px;
            background: linear-gradient(120deg,#fff 20%,#93c5fd 55%,#60a5fa 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: floatTitle 4s ease-in-out infinite;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #86efac;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
            padding: 5px 10px;
            border: 1px solid rgba(34,197,94,.2);
            background: rgba(34,197,94,.07);
            border-radius: 999px;
        }

        .creator {
            color: #64748b;
            font-size: 11px;
            margin-top: 8px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 28px 22px 24px;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 999px;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
            animation: messageUp .35s ease both;
        }

        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }

        .bubble {
            max-width: min(76%,720px);
            padding: 13px 17px;
            border-radius: 17px;
            line-height: 1.65;
            white-space: pre-wrap;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.16);
        }

        .user .bubble {
            background: linear-gradient(135deg,#2563eb,#3b82f6);
            color: #fff;
            border: 1px solid rgba(147,197,253,.2);
            border-bottom-right-radius: 5px;
        }

        .assistant .bubble {
            background: rgba(30,41,59,.82);
            color: #e2e8f0;
            border: 1px solid rgba(148,163,184,.12);
            border-bottom-left-radius: 5px;
            backdrop-filter: blur(10px);
        }

        .input-area {
            padding: 14px 20px 20px;
            border-top: 1px solid rgba(148,163,184,.14);
            background: rgba(8,13,24,.86);
            backdrop-filter: blur(18px);
            position: relative;
            z-index: 2;
        }

        .input-box {
            display: flex;
            gap: 10px;
            padding: 6px;
            border: 1px solid #334155;
            background: rgba(15,23,42,.9);
            border-radius: 15px;
            transition: .2s ease;
        }

        .input-box:focus-within {
            border-color: rgba(59,130,246,.7);
            box-shadow: 0 0 0 4px rgba(59,130,246,.08);
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 12px 13px;
            border: none;
            background: transparent;
            color: #f8fafc;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        #messageInput::placeholder { color: #64748b; }

        button {
            border: none;
            border-radius: 11px;
            padding: 0 19px;
            background: linear-gradient(135deg,#2563eb,#3b82f6);
            color: white;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(37,99,235,.28);
            filter: brightness(1.08);
        }

        button:active { transform: translateY(0); }

        #clearButton {
            margin-top: 10px;
            background: transparent;
            color: #64748b;
            padding: 7px 10px;
            font-size: 11px;
        }

        #clearButton:hover {
            color: #cbd5e1;
            background: rgba(148,163,184,.08);
            box-shadow: none;
        }

        .thinking {
            color: #94a3b8;
            font-style: italic;
        }

        @keyframes floatTitle {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes messageUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width:600px) {
            .header { padding: 22px 15px 15px; }
            .title { font-size: 30px; }
            .chat-container { padding: 22px 14px; }
            .bubble { max-width: 90%; font-size: 13.5px; }
            .input-area { padding: 12px 12px 15px; }
            .input-box { gap: 6px; }
            button { padding: 0 14px; }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================
         HEADER
    =========================== -->

    <div class="header">

        <div class="title">
            ✦ Nexora AI
        </div>

        <div class="subtitle">
            Intelligent assistant · LangChain + OpenRouter
        </div>

        <div class="status">
            ● Online
        </div>

        <div class="creator">
            Created by <b>Sagnik</b>
        </div>

    </div>



    <!-- ==========================
         CHAT
    =========================== -->

    <div
        class="chat-container"
        id="chatContainer"
    >

        {% for message in messages %}

            <div
                class="message {{ message.role }}"
            >

                <div class="bubble">

                    {{ message.content }}

                </div>

            </div>

        {% endfor %}

    </div>



    <!-- ==========================
         INPUT
    =========================== -->

    <div class="input-area">

        <div class="input-box">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask me anything..."
                autocomplete="off"
            >

            <button
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>


        <button
            id="clearButton"
            onclick="clearChat()"
        >
            🗑️ Clear Chat
        </button>

    </div>


</div>



<script>


    // =================================
    // GET ELEMENTS
    // =================================

    const messageInput =
        document.getElementById(
            "messageInput"
        );

    const chatContainer =
        document.getElementById(
            "chatContainer"
        );


    // =================================
    // SCROLL TO BOTTOM
    // =================================

    function scrollToBottom() {

        chatContainer.scrollTop =
            chatContainer.scrollHeight;
    }


    scrollToBottom();


    // =================================
    // ADD MESSAGE
    // =================================

    function addMessage(
        role,
        content
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message " + role;


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";


        bubble.textContent =
            content;


        message.appendChild(
            bubble
        );


        chatContainer.appendChild(
            message
        );


        scrollToBottom();
    }


    // =================================
    // SEND MESSAGE
    // =================================

    async function sendMessage() {

        const message =
            messageInput.value.trim();


        if (!message) {

            return;
        }


        // Show user message

        addMessage(
            "user",
            message
        );


        messageInput.value = "";


        // Thinking message

        const thinking =
            document.createElement(
                "div"
            );

        thinking.className =
            "message assistant";


        thinking.innerHTML =
            '<div class="bubble thinking">Thinking...</div>';


        chatContainer.appendChild(
            thinking
        );


        scrollToBottom();


        try {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            {
                                message: message
                            }
                        )
                    }
                );


            const data =
                await response.json();


            // Remove thinking

            thinking.remove();


            if (data.error) {

                addMessage(
                    "assistant",
                    "Error: " +
                    data.error
                );

                return;
            }


            addMessage(
                "assistant",
                data.answer
            );


        } catch (error) {

            thinking.remove();


            addMessage(
                "assistant",
                "Error connecting to server: " +
                error.message
            );
        }

    }


    // =================================
    // ENTER KEY
    // =================================

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendMessage();
            }

        }
    );


    // =================================
    // CLEAR CHAT
    // =================================

    async function clearChat() {

        try {

            await fetch(
                "/clear",
                {
                    method: "POST"
                }
            );

            chatContainer.innerHTML = "";

        } catch (error) {

            console.error(error);
        }

    }

</script>


</body>

</html>
