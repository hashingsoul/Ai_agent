<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexora AI — Intelligent Assistant</title>


    <style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap');
:root{--bg:#070b14;--panel:rgba(13,18,31,.78);--line:rgba(148,163,184,.13);--text:#f8fafc;--muted:#8995aa;--blue:#5b8cff;--violet:#8b5cf6;--green:#4ade80}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;color:var(--text);font-family:'DM Sans',system-ui,sans-serif;background:radial-gradient(900px 500px at 5% -10%,rgba(91,140,255,.17),transparent 65%),radial-gradient(800px 600px at 100% 0,rgba(139,92,246,.14),transparent 60%),#070b14}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 82%)}
.container{width:min(1180px,100%);height:100dvh;margin:auto;display:flex;flex-direction:column;position:relative;isolation:isolate}
.container:before,.container:after{content:'';position:fixed;width:300px;height:300px;border-radius:50%;filter:blur(100px);opacity:.08;pointer-events:none;z-index:-1}.container:before{background:#4f7cff;left:8%;top:10%;animation:float 10s ease-in-out infinite}.container:after{background:#a855f7;right:5%;bottom:8%;animation:float 12s ease-in-out infinite reverse}
.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:16px 24px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.64);backdrop-filter:blur(24px);position:relative;z-index:3}
.title{justify-self:start;font:800 21px/1 'Manrope',sans-serif;letter-spacing:-.7px;background:linear-gradient(110deg,#fff 25%,#9eb4ff 62%,#c4a8ff 90%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:floatTitle 4s ease-in-out infinite}.title:first-letter{font-size:1.05em}
.subtitle{justify-self:center;color:#738097;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}.status{justify-self:end;display:inline-flex;align-items:center;gap:7px;color:#9be7b2;font-size:10px;font-weight:700;padding:7px 10px;border:1px solid rgba(74,222,128,.15);background:rgba(74,222,128,.055);border-radius:999px}.status:first-letter{color:#4ade80}.creator{display:none}
.chat-container{flex:1;overflow-y:auto;padding:42px clamp(16px,6vw,72px) 30px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#26324a transparent}.chat-container::-webkit-scrollbar{width:7px}.chat-container::-webkit-scrollbar-thumb{background:#26324a;border-radius:99px}.message{display:flex;gap:10px;margin:0 auto 22px;width:min(900px,100%);animation:messageIn .32s cubic-bezier(.2,.8,.2,1) both}.message.user{justify-content:flex-end}.message:before{content:'✦';width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:10px;color:#b7c5ff;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:12px}.message.user:before{order:2;color:#fff;background:linear-gradient(135deg,#4f7cff,#7657e8);border-color:rgba(255,255,255,.13);content:'◉'}.bubble{max-width:min(78%,760px);padding:13px 16px;border-radius:17px;color:#dce3ef;font-size:14px;line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:rgba(20,28,44,.72);box-shadow:0 12px 35px rgba(0,0,0,.13);backdrop-filter:blur(14px)}.user .bubble{color:#fff;border-color:rgba(120,158,255,.22);border-bottom-right-radius:5px;background:linear-gradient(135deg,#416ff0,#6950dc);box-shadow:0 12px 34px rgba(73,91,220,.2)}.assistant .bubble{border-bottom-left-radius:5px}
.input-area{padding:10px clamp(12px,6vw,72px) max(17px,env(safe-area-inset-bottom));border-top:0;background:linear-gradient(to top,rgba(7,11,20,.98) 72%,rgba(7,11,20,.65));backdrop-filter:blur(20px);position:relative;z-index:2}.input-box{width:min(900px,100%);margin:auto;display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(148,163,184,.16);background:rgba(15,22,37,.9);border-radius:18px;box-shadow:0 20px 55px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.025);transition:.22s}.input-box:focus-within{border-color:rgba(91,140,255,.5);box-shadow:0 20px 55px rgba(0,0,0,.32),0 0 0 4px rgba(91,140,255,.07)}#messageInput{flex:1;min-width:0;height:44px;padding:0 12px;border:0;outline:0;background:transparent;color:#f8fafc;font-family:inherit;font-size:14px}#messageInput::placeholder{color:#59667c}button{border:0;font-family:inherit;cursor:pointer}.input-box>button{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:linear-gradient(135deg,#5b8cff,#7657e8);color:#fff;font-weight:700;box-shadow:0 8px 24px rgba(91,140,255,.2);transition:.2s}.input-box>button:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 12px 30px rgba(91,140,255,.3)}#clearButton{display:block;margin:9px auto 0;background:transparent;color:#536075;padding:5px 9px;font-size:10px}#clearButton:hover{color:#b7c1d0;background:rgba(255,255,255,.035);border-radius:8px}.thinking{color:#7c8aa0;font-style:italic}
@keyframes floatTitle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes float{50%{transform:translate3d(18px,12px,0) scale(1.08)}}@keyframes messageIn{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}
@media(max-width:600px){.header{grid-template-columns:1fr auto;padding:13px 14px}.title{font-size:18px}.subtitle{display:none}.status{font-size:9px;padding:6px 8px}.chat-container{padding:24px 12px 20px}.bubble{max-width:88%;font-size:13px;padding:11px 13px}.message{gap:8px;margin-bottom:17px}.message:before{width:27px;height:27px;flex-basis:27px;border-radius:9px;font-size:10px}.input-area{padding:7px 10px max(12px,env(safe-area-inset-bottom))}.input-box{border-radius:16px;min-height:53px}.input-box>button{width:40px;height:40px;flex-basis:40px;border-radius:12px}#messageInput{height:40px;font-size:14px;padding-left:8px}#clearButton{margin-top:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

        /* ---------- Precision layout fixes ---------- */

        .chat-container {
            align-content: flex-start;
        }

        .message {
            align-items: flex-start !important;
            min-height: 0 !important;
            height: auto !important;
        }

        .message-body {
            min-width: 0;
            height: auto !important;
            align-self: flex-start !important;
        }

        .bubble {
            display: block !important;
            width: fit-content;
            max-width: min(78%, 760px);
            min-height: 0 !important;
            height: auto !important;
            max-height: none !important;
            flex: 0 0 auto !important;
            align-self: flex-start !important;
            vertical-align: top;
            margin: 0;
        }

        .user .bubble {
            margin-left: auto;
        }

        .thinking {
            height: auto !important;
            min-height: 0 !important;
        }

        /* Premium motion */
        .bubble {
            transform-origin: 0 50%;
        }

        .user .bubble {
            transform-origin: 100% 50%;
        }

        .message:hover .bubble {
            border-color: rgba(148,163,184,.21);
        }

        .message.user:hover .bubble {
            border-color: rgba(170,190,255,.34);
        }

        .message::before {
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .message:hover::before {
            transform: translateY(-1px) scale(1.04);
            box-shadow: 0 8px 25px rgba(91,140,255,.13);
        }

        /* Refined title animation */
        .title {
            background-size: 220% auto;
            animation: premiumTitle 7s linear infinite;
        }

        .input-box {
            animation: composerBreath 5s ease-in-out infinite;
        }

        @keyframes premiumTitle {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes composerBreath {
            0%,100% {
                box-shadow: 0 20px 55px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.025);
            }
            50% {
                box-shadow: 0 24px 65px rgba(0,0,0,.36), 0 0 24px rgba(91,140,255,.035), inset 0 1px rgba(255,255,255,.03);
            }
        }

        @media (max-width: 600px) {
            .bubble {
                max-width: calc(100vw - 82px);
            }

            .message-body {
                max-width: calc(100% - 35px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .title, .input-box {
                animation: none !important;
            }
        }

    
        .thinking {
            display: inline-flex !important;
            align-items: center;
            gap: 8px;
        }

        .thinking-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .thinking-dots i {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #8ea0c0;
            animation: thinkingPulse 1.1s ease-in-out infinite;
        }

        .thinking-dots i:nth-child(2) { animation-delay: .15s; }
        .thinking-dots i:nth-child(3) { animation-delay: .3s; }

        @keyframes thinkingPulse {
            0%, 60%, 100% { opacity: .25; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-3px); }
        }

    
        /* ---------- Senior developer / AI visual system ---------- */

        body {
            background:
                radial-gradient(900px 520px at 15% -5%, rgba(74, 111, 255, .20), transparent 60%),
                radial-gradient(780px 520px at 92% 8%, rgba(139, 92, 246, .16), transparent 62%),
                radial-gradient(700px 520px at 55% 110%, rgba(34, 211, 238, .08), transparent 64%),
                #050914;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: .34;
            background:
                linear-gradient(115deg, transparent 0 47%, rgba(100,130,255,.045) 48%, transparent 49%),
                linear-gradient(65deg, transparent 0 57%, rgba(139,92,246,.035) 58%, transparent 59%);
            background-size: 340px 340px, 420px 420px;
            mask-image: radial-gradient(circle at center, black 0%, transparent 78%);
            animation: developerGrid 22s linear infinite;
        }

        .creator-credit {
            position: fixed;
            left: 50%;
            bottom: max(12px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: max-content;
            max-width: calc(100vw - 28px);
            padding: 7px 14px;
            border: 1px solid rgba(148,163,184,.10);
            border-radius: 999px;
            background: rgba(7, 11, 20, .52);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 35px rgba(0,0,0,.18);
            color: #65728a;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .13em;
            white-space: nowrap;
            pointer-events: none;
            animation: creditReveal .9s .7s cubic-bezier(.2,.8,.2,1) both;
        }

        .creator-credit strong {
            color: #cbd5ff;
            font-size: 9px;
            letter-spacing: .14em;
            text-shadow: 0 0 18px rgba(139,92,246,.22);
        }

        .creator-line {
            width: 22px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(120,143,255,.55));
        }

        .creator-line:last-child {
            background: linear-gradient(90deg, rgba(120,143,255,.55), transparent);
        }

        @keyframes developerGrid {
            from { background-position: 0 0, 0 0; }
            to { background-position: 340px 340px, -420px 420px; }
        }

        @keyframes creditReveal {
            from {
                opacity: 0;
                transform: translate(-50%, 10px) scale(.96);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
        }

        @media (max-width: 640px) {
            .creator-credit {
                gap: 6px;
                padding: 6px 10px;
                font-size: 7px;
                letter-spacing: .09em;
            }

            .creator-credit strong {
                font-size: 8px;
                letter-spacing: .10em;
            }

            .creator-line { width: 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            body::after,
            .creator-credit {
                animation: none !important;
            }
        }

    
        @media (max-width: 640px) {
            .creator-credit {
                bottom: calc(max(10px, env(safe-area-inset-bottom)) + 2px);
                opacity: .88;
            }

            .composer-wrap {
                padding-bottom: max(46px, calc(env(safe-area-inset-bottom) + 38px));
            }
        }

    </style>

</head>


<body>

    <footer class="creator-credit" aria-label="Created by Sagnik Sen">
        <span class="creator-line"></span>
        <span class="creator-label">DESIGNED &amp; ENGINEERED BY</span>
        <strong>SAGNIK SEN</strong>
        <span class="creator-line"></span>
    </footer>



<div class="container">


    <!-- ==========================
         HEADER
    =========================== -->

    <div class="header">
        <div class="title">✦ Nexora AI</div>
        <div class="subtitle">Intelligent assistant · LangChain + OpenRouter</div>
        <div class="status">● Online</div>
        <div class="creator">Created by <b>Sagnik</b></div>
    </div>



    <!-- ==========================
         CHAT
    =========================== -->

    <div
        class="chat-container"
        id="chatContainer"
    >

        {% for message in messages %}

            <div
                class="message {{ message.role }}"
            >

                <div class="bubble">

                    {{ message.content }}

                </div>

            </div>

        {% endfor %}

    </div>



    <!-- ==========================
         INPUT
    =========================== -->

    <div class="input-area">

        <div class="input-box">

            <input
                type="text"
                id="messageInput"
                placeholder="Message Nexora AI..."
                autocomplete="off"
            >

            <button aria-label="Send message" title="Send message" onclick="sendMessage()">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2 11 13"/>
                    <path d="m22 2-7 20-4-9-9-4 20-7Z"/>
                </svg>
            </button>

        </div>


        <button
            id="clearButton"
            onclick="clearChat()"
        >
            Clear conversation
        </button>

    </div>


</div>



<script>


    // =================================
    // GET ELEMENTS
    // =================================

    const messageInput =
        document.getElementById(
            "messageInput"
        );

    const chatContainer =
        document.getElementById(
            "chatContainer"
        );


    // =================================
    // SCROLL TO BOTTOM
    // =================================

    function scrollToBottom() {

        chatContainer.scrollTop =
            chatContainer.scrollHeight;
    }


    scrollToBottom();


    // =================================
    // ADD MESSAGE
    // =================================

    function addMessage(
        role,
        content
    ) {

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "message " + role;


        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";


        bubble.textContent =
            content;


        message.appendChild(
            bubble
        );


        chatContainer.appendChild(
            message
        );


        scrollToBottom();
    }


    // =================================
    // SEND MESSAGE
    // =================================

    async function sendMessage() {

        const message =
            messageInput.value.trim();


        if (!message) {

            return;
        }


        // Show user message

        addMessage(
            "user",
            message
        );


        messageInput.value = "";


        // Thinking message

        const thinking =
            document.createElement(
                "div"
            );

        thinking.className =
            "message assistant";


        thinking.innerHTML =
            '<div class="bubble thinking">Thinking<span class="thinking-dots"><i></i><i></i><i></i></span></div>';


        chatContainer.appendChild(
            thinking
        );


        scrollToBottom();


        try {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify(
                            {
                                message: message
                            }
                        )
                    }
                );


            const data =
                await response.json();


            // Remove thinking

            thinking.remove();


            if (data.error) {

                addMessage(
                    "assistant",
                    "Error: " +
                    data.error
                );

                return;
            }


            addMessage(
                "assistant",
                data.answer
            );


        } catch (error) {

            thinking.remove();


            addMessage(
                "assistant",
                "Error connecting to server: " +
                error.message
            );
        }

    }


    // =================================
    // ENTER KEY
    // =================================

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendMessage();
            }

        }
    );


    // =================================
    // CLEAR CHAT
    // =================================

    async function clearChat() {

        try {

            await fetch(
                "/clear",
                {
                    method: "POST"
                }
            );

            chatContainer.innerHTML = "";

        } catch (error) {

            console.error(error);
        }

    }

</script>


</body>

</html>
